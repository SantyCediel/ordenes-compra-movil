<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Órdenes de Compra</title>
  <meta name="description" content="Tus órdenes de compra, su estado y sus artículos, desde el celular.">
  <meta name="theme-color" content="#0a0a0e" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Órdenes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="iconos/icono-192.png">
  <link rel="apple-touch-icon" href="iconos/icono-180.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="fondo" aria-hidden="true"><i></i><i></i><i></i></div>

  <header id="barra">
    <div class="marca">
      <img src="iconos/icono-192.png" alt="">
      <div>
        <b>Órdenes de Compra</b>
        <small id="actualizado">Cargando…</small>
      </div>
    </div>
    <button id="btnRecargar" class="redondo" aria-label="Actualizar">
      <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
    </button>
    <button id="btnAjustes" class="redondo" aria-label="Ajustes">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main id="vista" tabindex="-1"></main>

  <nav id="pestanas">
    <a href="#/inicio" data-p="inicio"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Inicio</span></a>
    <a href="#/ordenes" data-p="ordenes"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg><span>Órdenes</span></a>
    <a href="#/seguimiento" data-p="seguimiento"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg><span>Seguimiento</span><em id="insignia" hidden></em></a>
    <a href="#/entregas" data-p="entregas"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Entregas</span></a>
  </nav>

  <section id="hoja" hidden aria-modal="true" role="dialog">
    <div class="velo" data-cerrar></div>
    <div class="panel">
      <div class="asa" data-cerrar></div>
      <div id="hojaCuerpo"></div>
    </div>
  </section>

  <div id="visor" hidden><img alt="Orden de compra"><button class="redondo" data-cerrar-visor aria-label="Cerrar">✕</button></div>
  <div id="aviso" hidden></div>

  <script src="config.js"></script>
  <script src="msal-browser.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
